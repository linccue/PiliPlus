name: Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_ios:
        description: "Build iOS"
        required: false
        default: false
        type: boolean
      build_mac:
        description: "Build Mac"
        required: false
        default: false
        type: boolean
      build_win_x64:
        description: "Build Win-x64"
        required: false
        default: false
        type: boolean
      build_linux_x64:
        description: "Build Linux-x64"
        required: false
        default: false
        type: boolean
      tag:
        description: "tag"
        required: false
        default: ""
        type: string

jobs:
  android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    name: Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Write key
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            echo storeFile='key.jks' >> android/key.properties
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
          fi

      - name: Set and Extract version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: lib/scripts/build.ps1 android

      # ================= 拦截下载 =================
      
      - name: Clean and Download JARs (With Retry)
        run: |
          mkdir -p build/media_kit_libs_android_video/20260906
          
          download_jar() {
            local arch=$1
            local url="https://ghproxy.net/https://github.com/My-Responsitories/libmpv-android-video-build/releases/download/20260906/default-${arch}.jar"
            local dest="build/media_kit_libs_android_video/20260906/default-${arch}.jar"
            
            echo "开始下载 ${arch}..."
            for i in {1..5}; do
              if curl -L --fail -o "$dest" "$url"; then
                echo "✅ ${arch} 下载成功！"
                return 0
              fi
              echo "⚠️ ${arch} 第 $i 次失败，等待 3 秒重试..."
              sleep 3
            done
            echo "❌ ${arch} 下载彻底失败！"
            exit 1
          }
          
          download_jar "arm64-v8a"
          download_jar "armeabi-v7a"
          download_jar "x86_64"

      - name: Disable media_kit Hash Check
        run: |
          flutter pub get
          GRADLE_FILE=$(find ~/.pub-cache -name "build.gradle" -path "*media_kit_libs_android_video*" | head -n 1)
          
          # 暴力替换：把下载函数和校验全毁了，让它只能读取我们下载好的文件
          sed -i 's/if (sha256 != null && !sha256.equalsIgnoreCase(fileSha256))/if (false)/g' "$GRADLE_FILE"
          sed -i 's/def downloadFile = {/def downloadFile = { return/g' "$GRADLE_FILE"
          sed -i 's/if (!file.exists())/if (false)/g' "$GRADLE_FILE"
          
          echo "✅ 插件拦截成功，它现在会直接使用我们下载的文件"

      # ============================================

      - name: Flutter Build Release Apk
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub 2>&1 | tee flutter_build.log

      - name: Rename
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
          done
        shell: bash

      - name: Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: PiliPlus_android_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Android_arm64-v8a
          path: PiliPlus_android_*_arm64-v8a.apk

      - name: 上传 armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Android_armeabi-v7a
          path: PiliPlus_android_*_armeabi-v7a.apk

      - name: 上传 x86_64
        uses: actions/upload-artifact@v4
        with:
          name: Android_x86_64
          path: PiliPlus_android_*_x86_64.apk

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android_build_log
          path: flutter_build.log

  ios:
    if: ${{ github.event.inputs.build_ios == 'true' }}
    uses: ./.github/workflows/ios.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  mac:
    if: ${{ github.event.inputs.build_mac == 'true' }}
    uses: ./.github/workflows/mac.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  win_x64:
    if: ${{ github.event.inputs.build_win_x64 == 'true' }}
    uses: ./.github/workflows/win_x64.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  linux_x64:
    if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
    uses: ./.github/workflows/linux_x64.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
